<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5dc;
        }

        header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #1b5e20;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        form {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;
        }

        h2 {
            color: #2e7d32;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
        }

        button:hover {
            background: #1b5e20;
        }

        footer {
            background: #1b5e20;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Us</h1>
        <p>We Would Love to Hear From You</p>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Our Services</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <form>

        <h2>Send Us a Message</h2>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Phone</label>
        <input type="text" placeholder="Enter your phone number">

        <label>Message</label>
        <textarea rows="5" placeholder="Enter your message"></textarea>

        <button type="submit">Submit</button>

    </form>

    <footer>
        © 2026 GreenLeaf
    </footer>

</body>
</html>
